---
extends: default
# Local runs skip what git ignores (.superpowers/, .tools/); CI checks out none of it.
ignore-from-file: .gitignore
rules:
  # Workflow run blocks carry long URLs and commands.
  line-length: disable
  # GitHub's `on:` key is read by yamllint as a truthy value.
  truthy:
    check-keys: false
  document-start: disable
  comments:
    min-spaces-from-content: 1
    # cloud-init requires the first line to be exactly `#cloud-config`.
    ignore: |
      wsl/user-data.template.yaml
