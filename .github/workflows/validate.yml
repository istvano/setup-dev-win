name: validate
on: [push, pull_request]
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-2025
    defaults:
      run:
        shell: pwsh
    steps:
      # Actions are pinned to full commit SHAs; tests/Repo.Tests.ps1 asserts it.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # No later step needs the job token; do not leave it in .git/config.
          persist-credentials: false
      # Versions come from tests/tool-versions.psd1, the same file script/test.ps1
      # imports the modules from, so the numbers live in one place.
      # Install-PSResource is PSResourceGet, bundled with PowerShell 7.4+; the
      # windows-2025 image ships a newer pwsh. Not verified on a real runner
      # from here, so the first push is the proof.
      - name: Install pinned test modules
        run: |
          $v = Import-PowerShellDataFile -Path tests/tool-versions.psd1
          Install-PSResource -Name Pester -Version $v.Pester -TrustRepository -AcceptLicense -Quiet -Scope CurrentUser
          Install-PSResource -Name PSScriptAnalyzer -Version $v.PSScriptAnalyzer -TrustRepository -AcceptLicense -Quiet -Scope CurrentUser
      # The release zip is pinned by version and verified against its SHA-256.
      - name: Install pinned chezmoi
        run: |
          $v = (Import-PowerShellDataFile -Path tests/tool-versions.psd1).Chezmoi
          $zip = Join-Path $env:RUNNER_TEMP 'chezmoi.zip'
          $url = "https://github.com/twpayne/chezmoi/releases/download/v$($v.Version)/chezmoi_$($v.Version)_windows_amd64.zip"
          Invoke-WebRequest -Uri $url -OutFile $zip
          $actual = (Get-FileHash -Algorithm SHA256 -LiteralPath $zip).Hash.ToLowerInvariant()
          if ($actual -ne $v.WindowsAmd64Sha256.ToLowerInvariant()) {
            throw "chezmoi checksum mismatch: expected $($v.WindowsAmd64Sha256), got $actual"
          }
          $dir = Join-Path $env:RUNNER_TEMP 'chezmoi'
          Expand-Archive -LiteralPath $zip -DestinationPath $dir
          Add-Content -Path $env:GITHUB_PATH -Value $dir
      - name: Gate
        run: pwsh -NoLogo -NoProfile -File script/test.ps1 -RequireLinters
      # Stage-0 runs on the Windows PowerShell 5.1 that ships with Windows, so its
      # tests run there too. Pester is installed for 5.1 separately: the
      # modules above went to the PowerShell 7 CurrentUser path.
      - name: Stage-0 tests under Windows PowerShell 5.1
        shell: powershell
        run: |
          $v = Import-PowerShellDataFile -Path tests/tool-versions.psd1
          Install-Module -Name Pester -RequiredVersion $v.Pester -Force -SkipPublisherCheck -Scope CurrentUser
          Import-Module -Name Pester -RequiredVersion $v.Pester -Force
          $config = New-PesterConfiguration
          $config.Run.Path = 'tests/Bootstrap.Tests.ps1'
          $config.Run.Exit = $true
          Invoke-Pester -Configuration $config

  static:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install validation tools
        run: |
          sudo apt-get update
          sudo apt-get install -y yamllint
          # actionlint and gitleaks are installed at exact versions with
          # `go install`, which also verifies them against the Go checksum
          # database. gitleaks keeps the github.com/zricethezav path because
          # that is the module path its go.mod declares.
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
          go install github.com/zricethezav/gitleaks/v8@v8.30.1
          echo "$HOME/go/bin" >>"$GITHUB_PATH"
      - name: actionlint
        run: actionlint
      # Every YAML file (workflows, cloud-init user-data, the yamllint config);
      # --strict makes warnings fail too.
      - name: yamllint
        run: yamllint --strict .
      - name: gitleaks
        run: gitleaks dir --no-banner --redact .
